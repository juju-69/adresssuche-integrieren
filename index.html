<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio-Suche</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background: #e6d8cd; 
      margin: 0; 
      padding: 20px; 
    }
    .container { 
      max-width: 900px; 
      margin: 0 auto; 
      background: #dcd6cf; 
      padding: 25px; 
      border-radius: 10px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
    }

    @media (max-width: 480px) {
      body { padding: 10px; }
      .container { padding: 15px; }
      .custom-header { flex-wrap: wrap; }
      .custom-header img { height: 60px; }
    }
    
    .custom-header {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .custom-header img {
      height: 100px;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
    }

    .search-box { 
      display: flex; 
      gap: 10px; 
      margin: 30px 0 35px; 
    }
    .search-box input { 
      flex: 1; 
      padding: 12px 16px; 
      border: none; 
      background-color: #222; 
      color: #fff; 
      border-radius: 8px; 
      font-size: 16px; 
      box-shadow: 0 0 35px 12px rgba(34, 34, 34, 0.4); 
      outline: none;
      transition: box-shadow 0.3s;
      min-width: 0;
    }

    .search-box input::placeholder { color: #a0a0a0; }
    .search-box input:focus { box-shadow: 0 0 45px 18px rgba(34, 34, 34, 0.6); }

    .search-box button { 
      padding: 12px 20px; 
      background-color: #222; 
      color: #fff; 
      border: none; 
      border-radius: 8px; 
      font-size: 16px; 
      cursor: pointer; 
      box-shadow: 0 0 35px 12px rgba(34, 34, 34, 0.4); 
      transition: background-color 0.2s; 
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
    }

    .search-box button:hover { background-color: #333; }
    .search-box button:disabled { cursor: not-allowed; opacity: 0.7; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-to-map, .btn-to-location {
      padding: 10px 18px;
      background-color: #222;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 0 20px 6px rgba(34, 34, 34, 0.3);
      transition: background-color 0.2s;
    }

    .btn-to-map:hover, .btn-to-location:hover { background-color: #333; }

    .table-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 30px 0 15px;
    }

    .result-card { 
      max-height: 0; 
      opacity: 0; 
      overflow: hidden; 
      background: #e8f5e9; 
      border: 1px solid #c8e6c9; 
      padding: 0 15px; 
      margin-bottom: 0; 
      border-radius: 8px; 
      transition: all 0.4s ease;
    }
    .result-card.visible {
      max-height: 300px;
      opacity: 1;
      padding: 15px;
      margin-bottom: 20px;
    }
    .result-card h3 { margin-top: 0; color: #2e7d32; }
    
    #map { height: 450px; border-radius: 8px; border: 1px solid #ddd; margin-top: 15px; }
    
    .bottom-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid rgba(0,0,0,0.1); }
    th { background-color: #d8cfc4; font-weight: bold; }
    
    tbody tr { cursor: pointer; transition: background 0.2s; }
    tbody tr:nth-child(even) { background-color: rgba(0, 0, 0, 0.04); }
    tbody tr:hover { background-color: rgba(0, 0, 0, 0.09); }
  </style>
</head>
<body>

<div class="container">
  <h2 class="custom-header">
    <img src="https://mcusercontent.com/61c5e3b1b5decfc41192af3ab/images/2fb37791-6334-26c2-4fd8-864de6a0e6f9.png" alt="Logo">
    Das nächste Studio finden
  </h2>
  <p>Bitte geben Sie Ihren Ortsnamen ein, um das nächste Studio zu finden.</p>
  
  <div class="search-box">
    <input type="text" id="userAddress" placeholder="Wo bist du gerade? (z.B. München)" onkeydown="if(event.key==='Enter') searchLocation()">
    <button onclick="searchLocation()">Suchen</button>
    <button id="gpsBtn" onclick="locateUserGPS()" title="Aktuellen Standort per GPS ermitteln">𖡡</button>
  </div>

  <div id="resultCard" class="result-card"></div>
  <div id="tableContainer"></div>

  <h3 style="margin-top: 30px;">🗺️ Karte zur Visualisierung</h3>
  <div id="map"></div>

  <div class="bottom-actions">
    <button class="btn-to-location" onclick="document.getElementById('userAddress').scrollIntoView({behavior:'smooth'}); document.getElementById('userAddress').focus();">Zurück zur Adresssuche</button>
    <button class="btn-to-location" onclick="focusUserLocation()">Zurück zu Ihrem Standort</button>
  </div>

  <p style="text-align: center; font-size: 12px; color: #888; margin-top: 15px;">
    Adresssuche powered by <a href="https://www.geoapify.com/" target="_blank" rel="noopener" style="color: #888;">Geoapify</a>
  </p>
</div>

<script>
const API_KEY = "ec396219d6ee495fbab2642e16835386";
/*Neue adressen kannst du hier mit dem 2. tool hinzufügen wie erklärt*/
const studios = [
  { name: "Wencke Haubold", adresse: "Markt 11, 04109 Leipzig, Deutschland", lat: 51.3406, lon: 12.3747 },
  { name: "Nicoletta Gora", adresse: "Schillerstr. 5a, 35452 Heuchelheim, Deutschland", lat: 50.5828, lon: 8.6322 },
  { name: "Samira Jawadi", adresse: "Schillerstr. 31, 60313 Frankfurt am Main, Deutschland", lat: 50.1152, lon: 8.6800 },
  { name: "Alexandra Schelcher", adresse: "Am Hufeisen 15, 27283 Verden, Deutschland", lat: 52.9248, lon: 9.2435 },
  { name: "Sara Pavo", adresse: "Merowinger Str. 35, 50677 Köln, Deutschland", lat: 50.9221, lon: 6.9551 },
  { name: "Denise Bramberger", adresse: "Burgstallstr. 11, 4523 Neuzeug, Österreich", lat: 48.0269, lon: 14.3792 },
  { name: "Zuzanne Lach", adresse: "Mariahilfer Str. 126/21, 1070 Wien, Österreich", lat: 48.1965, lon: 16.3424 },
  { name: "Julia Dittrich", adresse: "Haingasse 5, 61348 Bad Homburg, Deutschland", lat: 50.2281, lon: 8.6145 },
  { name: "Kim Kampe-Diekmann", adresse: "Doornkaatstr., 26506 Norden, Deutschland", lat: 53.5956, lon: 7.2046 },
  { name: "Christiane Maserke", adresse: "Sittardweg 24, 53902 Bad Münstereifel, Deutschland", lat: 50.5372, lon: 6.7628 },

  { name: "Petra Oberauner", adresse: "Mauthen 215, 9640 Kötschach-Mauthen, Österreich", lat: 46.6669, lon: 13.0041 },
  { name: "Bahar Durgunsu", adresse: "Kamener Str. 11, 33647 Bielefeld, Deutschland", lat: 51.9868, lon: 8.4907 },
  { name: "Christine Mörschbacher", adresse: "Sulzbacherstr. 18, 4820 Bad Ischl, Österreich", lat: 47.7126, lon: 13.6288 },
  { name: "Antje Benecke", adresse: "Ernst-Thälmann-Str. 36, 14789 Wusterwitz, Deutschland", lat: 52.3912, lon: 12.3871 },
  { name: "Karin Schnelzer", adresse: "Haid 146, 5760 Saalfelden, Österreich", lat: 47.4262, lon: 12.8465 },
  { name: "Heike Dossmann", adresse: "Moselstr. 3, 12159 Berlin, Deutschland", lat: 52.4721, lon: 13.3361 },
  { name: "Sophia Kreutzer", adresse: "Jüdenstr. 30, 06886 Lutherstadt Wittenberg, Deutschland", lat: 51.8665, lon: 12.6432 },
  { name: "Julia Petker", adresse: "Am Klostergarten 33, 53121 Bonn, Deutschland", lat: 50.7371, lon: 7.0543 },
  { name: "Irina Popp", adresse: "07260 Porreres, Mallorca, Spanien", lat: 39.5181, lon: 3.0232 },
  { name: "Julia Schwicker", adresse: "Ludwig-Jahn-Str. 72, 73732 Esslingen, Deutschland", lat: 48.7478, lon: 9.3245 },
  { name: "Julia Starke", adresse: "Halber Str. 16, 15746 Groß Köris, Deutschland", lat: 52.1678, lon: 13.6610 },
  { name: "Rachel Tino-Jehle", adresse: "Reberastr. 30, 9494 Schaan, Liechtenstein", lat: 47.1681, lon: 9.5110 },
  { name: "Yvonne Werner", adresse: "Tuchmacherstr. 11, 84453 Mühldorf am Inn, Deutschland", lat: 48.2435, lon: 12.5278 },
  { name: "Joana Pfeiderer", adresse: "Waggershauser Str. 145, 88045 Friedrichshafen, Deutschland", lat: 47.6625, lon: 9.4589 },
  { name: "Alexandra Lauer", adresse: "Jakob-Scheel-Weg 10/1, 73312 Geislingen, Deutschland", lat: 48.6189, lon: 9.8324 },
  { name: "Madelon Bänziger", adresse: "Bentemmerstraat 21A, 6942 Didam, Niederlande", lat: 51.9392, lon: 6.1554 },
  { name: "Sarah Seibert", adresse: "Im Störmersgut 21, 63874 Dammbach, Deutschland", lat: 49.8661, lon: 9.3408 },
  { name: "Jenny Hertel", adresse: "Oppenheimer Landstr. 42, 60596 Frankfurt am Main, Deutschland", lat: 50.0987, lon: 8.6832 },
  { name: "Miriam Felice", adresse: "Hauptstraße 75, 68259 Mannheim-Feudenheim, Deutschland", lat: 49.4841, lon: 8.5298 },
  { name: "Susanne Müller", adresse: "Weichser Str. 3, 85258 Weichs, Deutschland", lat: 48.3940, lon: 11.4265 },
  { name: "Jenny Kunz", adresse: "Buschstr. 91, 58099 Hagen, Deutschland", lat: 51.3909, lon: 7.4882 },
  { name: "Melissa Wefers", adresse: "Herzogstr. 49, 46145 Oberhausen, Deutschland", lat: 51.5300, lon: 6.8672 },
  { name: "Gréta Farkas", adresse: "Bismarckstr. 14, 75015 Bretten, Deutschland", lat: 49.0396, lon: 8.7012 },
  { name: "Hautkompetenz Praxis Kerstin Thiemeyer", adresse: "Schickstr. 9, 70182 Stuttgart, Deutschland", lat: 48.7691, lon: 9.1835 }
];

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [8.6821, 50.1109],
  zoom: 6
});

map.addControl(new maplibregl.NavigationControl(), 'top-left');

let mapReady = false;
let studioMarkers = {};
let currentUserMarker = null;
let userCoords = null;

map.on('load', () => { mapReady = true; });

function calcDist(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2)**2;
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

function createMarkerPin(bg, border) {
  const el = document.createElement('div');
  el.style.cssText = `width:16px; height:16px; border-radius:50%; background:${bg}; border:2px solid ${border}; box-shadow:0 0 4px rgba(0,0,0,0.5); cursor:pointer;`;
  return el;
}

function focusStudio(idx) {
  const target = studios[idx];
  const marker = studioMarkers[idx];
  if (target && marker) {
    map.flyTo({ center: [target.lon, target.lat], zoom: 14, duration: 1200 });
    if (!marker.getPopup().isOpen()) marker.togglePopup();
    document.getElementById('map').scrollIntoView({ behavior: 'smooth' });
  }
}

function focusUserLocation() {
  if (userCoords && currentUserMarker) {
    map.flyTo({ center: [userCoords.lon, userCoords.lat], zoom: 13, duration: 1200 });
    if (!currentUserMarker.getPopup().isOpen()) currentUserMarker.togglePopup();
    document.getElementById('map').scrollIntoView({ behavior: 'smooth' });
  } else {
    alert("Bitte gib zuerst einen Standort ein.");
  }
}

function updateMap(userLat, userLon, label, sortedList, closest) {
  Object.values(studioMarkers).forEach(m => m.remove());
  studioMarkers = {};
  if (currentUserMarker) currentUserMarker.remove();

  currentUserMarker = new maplibregl.Marker({ element: createMarkerPin('#28a745', '#fff') })
    .setLngLat([userLon, userLat])
    .setPopup(new maplibregl.Popup({ offset: 12 }).setHTML(`<b>Ihr Standort:</b><br>${label}`))
    .addTo(map);

  sortedList.forEach((item, idx) => {
    const origIndex = studios.findIndex(s => s.name === item.name);
    const color = idx === 0 ? '#e63946' : '#3388ff';
    const marker = new maplibregl.Marker({ element: createMarkerPin(color, '#fff') })
      .setLngLat([item.lon, item.lat])
      .setPopup(new maplibregl.Popup({ offset: 12 }).setHTML(`<b>${item.name}</b><br>${item.adresse}<br><b>${item.dist.toFixed(2)} km</b>`))
      .addTo(map);
    studioMarkers[origIndex] = marker;
  });

  const lineData = {
    type: 'Feature',
    geometry: { type: 'LineString', coordinates: [[userLon, userLat], [closest.lon, closest.lat]] }
  };

  if (map.getSource('route')) {
    map.getSource('route').setData(lineData);
  } else {
    map.addSource('route', { type: 'geojson', data: lineData });
    map.addLayer({
      id: 'route-line',
      type: 'line',
      source: 'route',
      paint: { 'line-color': '#e63946', 'line-width': 3, 'line-dasharray': [2, 2] }
    });
  }

  const lons = [userLon, closest.lon];
  const lats = [userLat, closest.lat];
  map.fitBounds(
    [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
    { padding: 60, animate: true, duration: 1200 }
  );
}

function updateView(lat, lon, labelText) {
  userCoords = { lat, lon };

  const list = studios.map(s => ({ ...s, dist: calcDist(lat, lon, s.lat, s.lon) }))
                     .sort((a, b) => a.dist - b.dist);
  
  const closest = list[0];

  const card = document.getElementById('resultCard');
  card.classList.add('visible');
  card.innerHTML = `
    <h3>🎉 Nächstes Studio: ${closest.name}</h3>
    <p>📍 <b>Adresse:</b> ${closest.adresse}</p>
    <p>📏 <b>Entfernung:</b> ${closest.dist.toFixed(2)} km</p>
  `;

  let rows = list.map(item => {
    const origIdx = studios.findIndex(s => s.name === item.name);
    return `
      <tr onclick="focusStudio(${origIdx})">
        <td><b>${item.name}</b></td>
        <td>${item.adresse}</td>
        <td>${item.dist.toFixed(2)} km</td>
      </tr>`;
  }).join('');

  document.getElementById('tableContainer').innerHTML = `
    <div class="table-header-flex">
      <h3 style="margin:0;">📋 Alle Studios nach Entfernung</h3>
      <button class="btn-to-map" onclick="document.getElementById('map').scrollIntoView({behavior:'smooth'})">Zur Karte</button>
    </div>
    <table>
      <thead><tr><th>Name</th><th>Adresse</th><th>Entfernung</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

  if (mapReady) {
    updateMap(lat, lon, labelText, list, closest);
  } else {
    map.once('load', () => updateMap(lat, lon, labelText, list, closest));
  }

  document.getElementById('map').scrollIntoView({ behavior: 'smooth' });
}

function locateUserGPS() {
  if (!navigator.geolocation) {
    alert("GPS wird von Ihrem Browser nicht unterstützt.");
    return;
  }

  const btn = document.getElementById('gpsBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';

  navigator.geolocation.getCurrentPosition(
    pos => {
      updateView(pos.coords.latitude, pos.coords.longitude, "GPS-Standort");
      btn.disabled = false;
      btn.innerHTML = '𖡡';
    },
    err => {
      alert("Standort konnte nicht ermittelt werden.");
      btn.disabled = false;
      btn.innerHTML = '𖡡';
    },
    { timeout: 6000 }
  );
}

async function searchLocation() {
  const query = document.getElementById('userAddress').value.trim();
  if (!query) return;

  try {
    const res = await fetch(`https://api.geoapify.com/v1/geocode/search?text=${encodeURIComponent(query)}&apiKey=${API_KEY}&format=json&lang=de`);
    const data = await res.json();

    if (!data.results || data.results.length === 0) {
      alert("Ort wurde nicht gefunden.");
      return;
    }

    const { lat, lon, formatted } = data.results[0];
    updateView(parseFloat(lat), parseFloat(lon), formatted);
  } catch (e) {
    alert("Fehler bei der Suche.");
  }
}
</script>

</body>
</html>
