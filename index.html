<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio-Suche</title>

  <!-- MapLibre GL JS für die interaktive Karte (kompatibel mit OpenFreeMap) -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  
  <style>
    body { font-family: 'Helvetica', 'Arial', sans-serif; background-color: #e6d8cd; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: auto; background: #dcd6cf; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

    @media (max-width: 480px) {
      body { padding: 10px; }
      .container { padding: 15px; }
      .custom-header { flex-wrap: wrap; }
      .custom-header img { height: 60px; }
    }
    
    /* Header mit Logo-Ausrichtung */
    .custom-header {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .custom-header img {
      height: 100px;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
    }

    .search-box { display: flex; gap: 10px; margin-top: 30px; margin-bottom: 35px; }
    .search-box input { 
      flex: 1; 
      padding: 12px 16px; 
      border: none; 
      background-color: #222222; 
      color: #FFFFFF; 
      border-radius: 8px; 
      font-size: 16px; 
      box-shadow: 0 0 35px 12px rgba(34, 34, 34, 0.4); 
      outline: none;
      transition: all 0.3s ease;
      min-width: 0;
    }

    .search-box input::placeholder { 
      color: #A0A0A0; 
    }

    .search-box input:focus {
      box-shadow: 0 0 45px 18px rgba(34, 34, 34, 0.6);
    }

    .search-box button { 
      padding: 12px 20px; 
      background-color: #222222; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 16px; 
      cursor: pointer; 
      box-shadow: 0 0 35px 12px rgba(34, 34, 34, 0.4); 
      transition: all 0.3s ease; 
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
    }

    .search-box button:hover { 
      background-color: #333333; 
      box-shadow: 0 0 45px 18px rgba(34, 34, 34, 0.6);
    }

    .search-box button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* CSS Ladekreis (Spinner) */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Standard-Buttons im gleichen Design */
    .btn-to-map, .btn-to-location {
      padding: 10px 18px;
      background-color: #222222;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Helvetica', 'Arial', sans-serif;
      cursor: pointer;
      box-shadow: 0 0 20px 6px rgba(34, 34, 34, 0.3);
      transition: all 0.3s ease;
    }

    .btn-to-map:hover, .btn-to-location:hover {
      background-color: #333333;
      box-shadow: 0 0 30px 10px rgba(34, 34, 34, 0.5);
    }

    .table-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
      margin-bottom: 15px;
    }

    .result-card { 
      max-height: 0; 
      opacity: 0; 
      overflow: hidden; 
      background: #e8f5e9; 
      border: 1px solid #c8e6c9; 
      padding: 0 15px; 
      margin-bottom: 0; 
      border-radius: 8px; 
      transition: max-height 0.4s ease, opacity 0.4s ease, padding 0.4s ease, margin-bottom 0.4s ease;
    }
    .result-card.visible {
      max-height: 300px;
      opacity: 1;
      padding: 15px;
      margin-bottom: 20px;
    }
    .result-card h3 { margin-top: 0; color: #2e7d32; }
    #map { height: 450px; border-radius: 8px; border: 1px solid #ddd; margin-top: 15px; }
    
    .bottom-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid rgba(0,0,0,0.1); }
    th { background-color: #d8cfc4; font-weight: bold; }
    
    tbody tr {
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    tbody tr:nth-child(even) {
      background-color: rgba(0, 0, 0, 0.04);
    }

    tbody tr:hover {
      background-color: rgba(0, 0, 0, 0.09);
    }
  </style>
</head>
<body>

<div class="container">
  <h2 class="custom-header">
    <img src="https://mcusercontent.com/61c5e3b1b5decfc41192af3ab/images/2fb37791-6334-26c2-4fd8-864de6a0e6f9.png" alt="Logo">
    Das nächste Studio finden
  </h2>
  <p>Bitte geben Sie ihren Ortsnamen ein, um das nächste Studio zu finden.</p>
  
  <div class="search-box">
    <input type="text" id="userAddress" placeholder="Wo bist du gerade? (z.B. München)" onkeypress="if(event.key==='Enter') searchLocation()">
    <button onclick="searchLocation()">Suchen</button>
    <!-- GPS-Button mit ID für Spinner-Steuerung -->
    <button id="gpsBtn" onclick="locateUserGPS()" title="Aktuellen Standort per GPS ermitteln">𖡡</button>
  </div>

  <div id="resultCard" class="result-card"></div>
  
  <div id="tableContainer"></div>

  <h3 style="margin-top: 30px;">🗺️ Karte zur Visualisierung</h3>
  <div id="map"></div>

  <div class="bottom-actions">
    <button class="btn-to-location" onclick="smoothScrollToElement(document.getElementById('userAddress')); document.getElementById('userAddress').focus({ preventScroll: true });">Zurück zur Adresssuche</button>
    <button class="btn-to-location" onclick="focusUserLocation()">Zurück zu Ihrem Standort</button>
  </div>

  <p style="text-align: center; font-size: 12px; color: #888; margin-top: 15px;">
    Adresssuche powered by <a href="https://www.geoapify.com/" target="_blank" rel="noopener" style="color: #888;">Geoapify</a>
  </p>
</div>

<script>
const FESTE_ADRESSEN = [

  { name: "Nicoletta Gora", adresse: "Schillerstr. 5a, 35452 Heuchelheim, Deutschland", lat: 50.5828, lon: 8.6322 },
  { name: "Samira Jawadi", adresse: "Schillerstr. 31, 60313 Frankfurt am Main, Deutschland", lat: 50.1152, lon: 8.6800 },
  { name: "Alexandra Schelcher", adresse: "Am Hufeisen 15, 27283 Verden, Deutschland", lat: 52.9248, lon: 9.2435 },
  { name: "Sara Pavo", adresse: "Merowinger Str. 35, 50677 Köln, Deutschland", lat: 50.9221, lon: 6.9551 },
  { name: "Denise Bramberger", adresse: "Burgstallstr. 11, 4523 Neuzeug, Österreich", lat: 48.0269, lon: 14.3792 },

  { name: "Kim Kampe-Diekmann", adresse: "Doornkaatstr., 26506 Norden, Deutschland", lat: 53.5956, lon: 7.2046 },

  { name: "Petra Oberauner", adresse: "Mauthen 215, 9640 Kötschach-Mauthen, Österreich", lat: 46.6669, lon: 13.0041 },

  { name: "Julia Starke", adresse: "Halber Str. 16, 15746 Groß Köris, Deutschland", lat: 52.1678, lon: 13.6610 },

  { name: "Yvonne Werner", adresse: "Tuchmacherstr. 11, 84453 Mühldorf am Inn, Deutschland", lat: 48.2435, lon: 12.5278 },

  { name: "Sarah Seibert", adresse: "Im Störmersgut 21, 63874 Dammbach, Deutschland", lat: 49.8661, lon: 9.3408 },
  { name: "Jenny Hertel", adresse: "Oppenheimer Landstr. 42, 60596 Frankfurt am Main, Deutschland", lat: 50.0987, lon: 8.6832 },
  { name: "Miriam Felice", adresse: "Hauptstraße 75, 68259 Mannheim-Feudenheim, Deutschland", lat: 49.4841, lon: 8.5298 },
  { name: "Susanne Müller", adresse: "Weichser Str. 3, 85258 Weichs, Deutschland", lat: 48.3940, lon: 11.4265 },
  { name: "Jenny Kunz", adresse: "Buschstr. 91, 58099 Hagen, Deutschland", lat: 51.3909, lon: 7.4882 },
  { name: "Melissa Wefers", adresse: "Herzogstr. 49, 46145 Oberhausen, Deutschland", lat: 51.5300, lon: 6.8672 },
  { name: "Gréta Farkas", adresse: "Bismarckstr. 14, 75015 Bretten, Deutschland", lat: 49.0396, lon: 8.7012 },
  { name: "Hautkompetenz Praxis Kerstin Thiemeyer", adresse: "Schickstr. 9, 70182 Stuttgart, Deutschland", lat: 48.7691, lon: 9.1835 },
];

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [8.6821, 50.1109],
  zoom: 6
});
map.addControl(new maplibregl.NavigationControl(), 'top-left');
let mapReady = false;
map.on('load', () => { mapReady = true; });

let studioMarkers = {};
let currentUserMarker = null;
let userCoords = null;

function smoothScrollToElement(el) {
  const rect = el.getBoundingClientRect();
  const startY = window.scrollY;
  const targetY = startY + rect.top - (window.innerHeight / 2 - rect.height / 2);
  const distance = targetY - startY;
  const duration = 600;
  const startTime = performance.now();

  function step(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
    window.scrollTo(0, startY + distance * ease);
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function calculateDistance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

function createDotElement(fillColor, borderColor) {
  const el = document.createElement('div');
  el.style.width = '16px';
  el.style.height = '16px';
  el.style.borderRadius = '50%';
  el.style.backgroundColor = fillColor;
  el.style.border = `2px solid ${borderColor}`;
  el.style.boxShadow = '0 0 4px rgba(0,0,0,0.5)';
  el.style.cursor = 'pointer';
  return el;
}

function focusStudio(index) {
  const ziel = FESTE_ADRESSEN[index];
  const marker = studioMarkers[index];
  if (ziel && marker) {
    map.flyTo({ center: [ziel.lon, ziel.lat], zoom: 14, duration: 1500 });
    if (!marker.getPopup().isOpen()) marker.togglePopup();
    smoothScrollToElement(document.getElementById('map'));
  }
}

function focusUserLocation() {
  if (userCoords && currentUserMarker) {
    map.flyTo({ center: [userCoords.lon, userCoords.lat], zoom: 13, duration: 1500 });
    if (!currentUserMarker.getPopup().isOpen()) currentUserMarker.togglePopup();
    smoothScrollToElement(document.getElementById('map'));
  } else {
    alert("Bitte führe zuerst eine Suche durch oder nutze den GPS-Button.");
  }
}

function renderMapData(userLat, userLon, labelText, results, closest) {
  // Alte Marker entfernen
  Object.values(studioMarkers).forEach(m => m.remove());
  studioMarkers = {};
  if (currentUserMarker) currentUserMarker.remove();

  // Nutzer-Marker (grün)
  currentUserMarker = new maplibregl.Marker({ element: createDotElement('#28a745', 'white') })
    .setLngLat([userLon, userLat])
    .setPopup(new maplibregl.Popup({ offset: 12 }).setHTML(`<b>Ihr Standort:</b><br>${labelText}`))
    .addTo(map);
  currentUserMarker.togglePopup();

  // Studio-Marker (rot = nächstes, blau = restliche)
  results.forEach((ziel, idx) => {
    const originalIndex = FESTE_ADRESSEN.findIndex(f => f.name === ziel.name);
    const color = idx === 0 ? '#e63946' : '#3388ff';
    const marker = new maplibregl.Marker({ element: createDotElement(color, 'white') })
      .setLngLat([ziel.lon, ziel.lat])
      .setPopup(new maplibregl.Popup({ offset: 12 }).setHTML(`<b>${ziel.name}</b><br>${ziel.adresse}<br><b>${ziel.distanz.toFixed(2)} km</b>`))
      .addTo(map);
    studioMarkers[originalIndex] = marker;
  });

  // Verbindungslinie zwischen Nutzer und nächstem Studio
  const routeGeoJSON = {
    type: 'Feature',
    geometry: { type: 'LineString', coordinates: [[userLon, userLat], [closest.lon, closest.lat]] }
  };
  if (map.getSource('route')) {
    map.getSource('route').setData(routeGeoJSON);
  } else {
    map.addSource('route', { type: 'geojson', data: routeGeoJSON });
    map.addLayer({
      id: 'route-line',
      type: 'line',
      source: 'route',
      paint: { 'line-color': '#e63946', 'line-width': 3, 'line-dasharray': [2, 2] }
    });
  }

  const lons = [userLon, closest.lon];
  const lats = [userLat, closest.lat];
  
  // Flüssige Kamera-Animation zur Kartenansicht (1500 ms)
  map.fitBounds(
    [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
    { 
      padding: 60,
      animate: true,
      duration: 1500 
    }
  );
}

function processCoordinates(userLat, userLon, labelText) {
  userCoords = { lat: userLat, lon: userLon };

  let results = FESTE_ADRESSEN.map(ziel => {
    const dist = calculateDistance(userLat, userLon, ziel.lat, ziel.lon);
    return { ...ziel, distanz: dist };
  });

  results.sort((a, b) => a.distanz - b.distanz);
  const closest = results[0];

  const resultCard = document.getElementById('resultCard');
  resultCard.classList.add('visible');
  resultCard.innerHTML = `
    <h3>🎉 Nächstes Studio: ${closest.name}</h3>
    <p>📍 <b>Adresse:</b> ${closest.adresse}</p>
    <p>📏 <b>Entfernung (Luftlinie):</b> ${closest.distanz.toFixed(2)} km</p>
  `;

  let tableHTML = `
    <div class="table-header-flex">
      <h3 style="margin: 0;">📋 Alle Studios nach Entfernung per Luftlinie</h3>
      <button class="btn-to-map" onclick="smoothScrollToElement(document.getElementById('map'))">Zur Karte</button>
    </div>
    <table>
      <thead>
        <tr><th>Name</th><th>Adresse</th><th>Entfernung (km)</th></tr>
      </thead>
      <tbody>
  `;
  
  results.forEach(r => {
    const originalIndex = FESTE_ADRESSEN.findIndex(f => f.name === r.name);
    tableHTML += `
      <tr onclick="focusStudio(${originalIndex})" title="Klicken, um Standort auf Karte zu zeigen">
        <td><b>${r.name}</b></td>
        <td>${r.adresse}</td>
        <td>${r.distanz.toFixed(2)} km</td>
      </tr>`;
  });
  tableHTML += '</tbody></table>';
  document.getElementById('tableContainer').innerHTML = tableHTML;

  if (mapReady) {
    renderMapData(userLat, userLon, labelText, results, closest);
  } else {
    map.once('load', () => renderMapData(userLat, userLon, labelText, results, closest));
  }

  // Weiches Scrollen zur Karte nach Auswertung
  smoothScrollToElement(document.getElementById('map'));
}

function locateUserGPS() {
  if (!navigator.geolocation) {
    alert("Geolocation wird von Ihrem Browser leider nicht unterstützt.");
    return;
  }

  const btn = document.getElementById('gpsBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';

  navigator.geolocation.getCurrentPosition(
    (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      processCoordinates(lat, lon, "GPS-Standort");
      
      btn.disabled = false;
      btn.innerHTML = '𖡡';
    },
    (error) => {
      alert("Standortzugriff konnte nicht ermittelt werden. Bitte prüfe deine Browser-Einstellungen.");
      btn.disabled = false;
      btn.innerHTML = '𖡡';
    },
    { 
      enableHighAccuracy: false,
      timeout: 6000,
      maximumAge: 60000
    }
  );
}

async function fetchGeocoding(query) {
  const GEOAPIFY_API_KEY = "ec396219d6ee495fbab2642e16835386";
  const url = `https://api.geoapify.com/v1/geocode/search?text=${encodeURIComponent(query)}&apiKey=${GEOAPIFY_API_KEY}&format=json&lang=de`;
  const response = await fetch(url);
  if (!response.ok) throw new Error("Geoapify Geocoding Abfrage fehlgeschlagen");
  const data = await response.json();

  return data.results.map(result => ({
    lat: result.lat,
    lon: result.lon,
    display_name: result.formatted
  }));
}

async function searchLocation() {
  const query = document.getElementById('userAddress').value;
  if (!query) return;

  try {
    const data = await fetchGeocoding(query);

    if (!data || data.length === 0) {
      alert("Ort konnte nicht gefunden werden. Bitte überprüfen Sie die Schreibweise.");
      return;
    }

    const userLat = parseFloat(data[0].lat);
    const userLon = parseFloat(data[0].lon);

    processCoordinates(userLat, userLon, data[0].display_name);

  } catch (err) {
    alert("Fehler bei der Adresssuche. Bitte versuche es erneut.");
  }
}
</script>
